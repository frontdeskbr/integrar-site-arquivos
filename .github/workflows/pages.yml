name: Publicar arquivos públicos
on:
  push:
    branches: [main]
    paths: [news.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar pacote público verificado
        run: |
          curl --fail --location --retry 3 --output /tmp/public.zip "https://github.com/${{ github.repository }}/releases/download/v1.0.0/public.zip"
          echo "19cf7428b3f18c70787996053c7ca0301c242fabe3312199f5778b514818d29e  /tmp/public.zip" | sha256sum --check -
      - name: Validar e extrair conteúdo
        run: |
          python - <<'PY'
          import pathlib,zipfile
          dest=pathlib.Path('_site');dest.mkdir(exist_ok=True)
          with zipfile.ZipFile('/tmp/public.zip') as z:
              assert z.testzip() is None
              for name in z.namelist():
                  assert '/' not in name and '\\' not in name,name
              z.extractall(dest)
          if pathlib.Path('news.json').exists():
              import shutil
              shutil.copyfile('news.json',dest/'news.json')
          print('Arquivos verificados:',len(list(dest.iterdir())))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
